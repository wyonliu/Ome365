name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pii-scan:
    name: PII 4 道防线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整 history · for L3 history scan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run PII scanner (L1 + L2 + L4)
        run: python3 scripts/scan_pii.py
      - name: Verify fixture contract (47/47)
        run: python3 scripts/scan_pii.py --fixtures

  syntax-check:
    name: 语法检查（bash + python）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bash syntax (install.sh / ome365 / setup.sh)
        run: |
          for f in install.sh ome365 setup.sh; do
            if [ -f "$f" ]; then
              bash -n "$f" && echo "✓ $f"
            fi
          done
      - name: Python compile check (.app/*.py + scripts/*.py)
        run: |
          python3 -m compileall -q .app scripts skills 2>&1 | tee /tmp/compile.log
          if grep -q "SyntaxError\|Error" /tmp/compile.log; then exit 1; fi
          echo "✓ all .py files compile"

  smoke-test:
    name: Smoke test (boot server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          else
            python3 -m pip install fastapi uvicorn pydantic
          fi
      - name: Boot server (5s smoke)
        run: |
          python3 .app/server.py > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 5
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "✗ Server died"
            tail -30 /tmp/server.log
            exit 1
          fi
          # 测 main page + dashboard
          curl -fsS http://localhost:3650/ > /dev/null && echo "✓ /"
          curl -fsS http://localhost:3650/api/dashboard > /dev/null && echo "✓ /api/dashboard"
          kill $SERVER_PID 2>/dev/null || true

  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python3 -m pip install pytest pytest-cov
          # cryptography for share_auth + ed25519 signing (v1.1.2)
          python3 -m pip install cryptography
          # PyYAML for eval-config / SKILL.md frontmatter
          python3 -m pip install pyyaml
          # FastAPI + httpx for TestClient-based v1.1 router tests
          python3 -m pip install fastapi httpx pydantic
      - name: Full pytest suite (433+ tests · v1.0 + v1.1 + v1.1.x)
        run: python3 -m pytest tests/ -q --tb=short
      - name: v1.1 module load smoke
        run: |
          ./ome365 doctor
      - name: Coverage report (v1.1 modules)
        run: |
          python3 -m pytest tests/ -q \
            --cov=.app/ome365_eval --cov=.app/ome365_decisions \
            --cov=.app/ome365_trace --cov=.app/ome365_wiki \
            --cov=.app/ome365_archive --cov=.app/ome365_backup \
            --cov=.app/ome365_audit --cov=.app/ome365_metrics \
            --cov=.app/ome365_notify --cov=.app/ome365_rbac \
            --cov=.app/ome365_signing --cov=.app/ome365_cli_extras \
            --cov-report=term-missing --no-cov-on-fail || true

  install-sh-test:
    name: install.sh 三平台 dry-run
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: bash -n syntax
        run: bash -n install.sh
      - name: --dry-run preview
        run: bash install.sh --dry-run
      - name: OME365_DRY_RUN=1 (env-driven)
        run: OME365_DRY_RUN=1 bash install.sh

  v1_1-cockpit-e2e:
    name: v1.1 cockpit e2e smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyyaml cryptography
      - name: Boot server in background
        run: |
          OME365_PORT=3699 OME365_VAULT="$PWD/vault.example" \
            python3 .app/server.py &> /tmp/server.log &
          sleep 6
          curl -sf http://127.0.0.1:3699/v1_1.html >/dev/null
      - name: Hit all v1.1 endpoints
        run: |
          for ep in "/v1_1.html" \
                    "/api/decision/list" \
                    "/api/eval/skills" \
                    "/api/eval/whoami" \
                    "/api/eval/actors" \
                    "/api/eval/role/alice" \
                    "/api/eval/finops/dashboard?since_days=365" \
                    "/api/eval/member/alice?window_days=365" \
                    "/.well-known/agent-card.json" \
                    "/metrics"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3699$ep")
            echo "$ep → $code"
            test "$code" = "200" || { echo "::error::$ep returned $code"; exit 1; }
          done
      - name: Verify ed25519 agent-card signature
        run: ./ome365 verify "http://127.0.0.1:3699/.well-known/agent-card.json"
