# Cost-per-Outcome Industry Benchmarks · 2026 Q1-Q2
#
# Sources:
#   - Salesforce 2026-04-15 "Tokenmaxxing AI ROI metrics" (Axios)
#   - NavyaAI 2026 Q1 enterprise AI cost report
#   - FinOps Foundation "FinOps for AI" 2026-Q1
#   - Forrester "End of AI Pilot Era" 2026-04 (Google Cloud Next)
#
# These figures are aggregated from public reports · use for cockpit FinOps
# dashboard comparisons. Refresh monthly via 2026-industry-survey.md.
#
# Path: vault/Eval/industry-benchmarks.yml (loaded by ome365_eval.py)

cost_per_resolved_decision:
  industry_p25_usd: 50
  industry_p50_usd: 35
  industry_p75_usd: 20
  unit: "USD per closed decision"
  context: "Includes LLM cost + reviewer time"
  source: "Salesforce + NavyaAI 2026 Q1"
  refreshed: 2026-04-15

human_equivalent_hourly:
  industry_p25_usd: 120
  industry_p50_usd: 80
  industry_p75_usd: 50
  unit: "USD per human hour replaced by AI"
  context: "Avg US contractor hourly rate baseline"
  source: "NavyaAI 2026 + BLS hourly wage data"
  refreshed: 2026-04-15

revenue_per_workflow:
  industry_p25_usd: 800
  industry_p50_usd: 1200
  industry_p75_usd: 2500
  unit: "USD revenue tracked per AI-driven workflow"
  context: "Sales / contract / decision-driven workflow only"
  source: "Forrester End of AI Pilot Era 2026-04"
  refreshed: 2026-04-23

# Sector breakdown (P50 only · for industry-specific dashboards) ────────────
sectors:
  fintech:
    cost_per_resolved_decision_p50_usd: 28
    revenue_per_workflow_p50_usd: 3500
    note: "high-revenue per workflow · regulatory review increases per-decision cost"
  saas_b2b:
    cost_per_resolved_decision_p50_usd: 32
    revenue_per_workflow_p50_usd: 1800
    note: "Salesforce/NavyaAI baseline cohort"
  manufacturing:
    cost_per_resolved_decision_p50_usd: 45
    revenue_per_workflow_p50_usd: 900
    note: "longer review cycles · higher elapsed_days"
  consulting:
    cost_per_resolved_decision_p50_usd: 22
    revenue_per_workflow_p50_usd: 4200
    note: "billable-hour replacement is direct ROI"
  healthcare:
    cost_per_resolved_decision_p50_usd: 55
    revenue_per_workflow_p50_usd: 1100
    note: "compliance review adds 30-40% time"
  retail:
    cost_per_resolved_decision_p50_usd: 18
    revenue_per_workflow_p50_usd: 700
    note: "high decision volume · low per-decision cost"

