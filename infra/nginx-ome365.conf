# nginx 站点配置 · ome365.example.com → 127.0.0.1:3651
#
# ═══════════════════════════════════════════════════════════════════════
# 架构（与 ai-hub.example.com / skill-hub.conf 同模式）
# ═══════════════════════════════════════════════════════════════════════
# 外部 HTTPS → 10.0.0.50:443（SSL 终结 + *.example.com 证书）
#           → 10.0.0.144:80（本机 nginx，按 server_name 分发）
#           → 127.0.0.1:3651（FastAPI share_server）
#
# 本文件部署到 **10.0.0.144** 本机：/etc/nginx/conf.d/ome365.conf
# （install-remote.sh 自动装）
# ═══════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name ome365.example.com 10.0.0.144;

    access_log /var/log/ome365-logs/nginx.access.log;
    error_log  /var/log/ome365-logs/nginx.error.log warn;

    client_max_body_size 20M;  # /api/publish 要上传 doc + 图

    location / {
        proxy_pass         http://127.0.0.1:3651;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Set-Cookie;
        proxy_redirect     off;
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass         http://127.0.0.1:3651;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 10m;
        expires            1h;
        add_header         Cache-Control "public, max-age=3600";
    }

    location /reports-static/ {
        proxy_pass         http://127.0.0.1:3651;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires            1h;
        add_header         Cache-Control "public, max-age=3600";
    }
}
